<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 10</title>
</head>
<body>
    <form action="" method="post" name= "formulario" enctype="application/x-www-form-urlencoded">
        
        <fieldset>

            <legend>Datos Personales</legend>

            <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="nombreusuario" placeholder="Nombre">
                <br>
            <label for="apellido">Apellido: </label>
                <input type="text" id="apellido" name="apellidousuario" placeholder="Apellido">
                <br>
            <label for="telefono">Teléfono: </label>
                <input type="tel" id="telefono" name="telefono" placeholder="+123456">
                <br>
            <label for="direccion">Dirección: </label>
                <input type="text" id="direccion" name="direccion" placeholder="Direccion">
                <br>
            <label for="email">Email: </label>
                <input type="email" id="email" name="direccionemail" placeholder="nombre@...">
                <br>

        </fieldset>
        <br>
        <fieldset>
            
            <legend>Selección de Curso</legend>

            <label for="frontend">Curso de Front-End</label>
                <input type="checkbox" id="frontend" name="cursos" value="frontend">
                <br>
            <label for="java">Curso de Java</label>
                <input type="checkbox" id="java" name="cursos" value="java">
                <br>
            <label for="fullstack">Curso de Fullstack</label>
                <input type="checkbox" id="fullstack" name="cursos" value="fullstack">
                <br>

        </fieldset>
        <br>
        <button type="submit">Enviar inscripición</button>
    </form>
</body>
</html>
