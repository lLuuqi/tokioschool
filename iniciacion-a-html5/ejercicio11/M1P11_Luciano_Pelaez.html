<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 11</title>
</head>
<body>
    <form method="post">
        <fieldset>
            
            <legend>Registro de Usuario</legend>
                
                <label for="nombre">Nombre: </label>
                    <input type="text" id="nombre" name="nombreusuario" placeholder="Nombre" required>
                    <br>
                <div>Género:</div>
                <label for="masc">Masculino</label>
                    <input type="radio" id="masc" name="genero" value="masc">
                    <br>
                <label for="fem">Femenino</label>
                    <input type="radio" id="fem" name="genero" value="fem">
                    <br>
                <label for="nacimiento">Fecha de nacimiento: </label>
                    <input type="date" id="nacimiento" name="fechanacimiento">
                    <br>
                <label for="email">Email: </label>
                    <input type="email" id="email" name="direccionemail" placeholder="email@..." required>
                    <br>
                <label for="password">Contraseña: </label>
                    <input type="password" id="password" name="contrasena" placeholder="*******" required>
                    <br>
                <label for="asignaturas">Número de asignaturas matriculadas: </label>
                    <input type="number" id="asignaturas" name="asignaturas" min="1" max="15">
                    <br>
                <label for="curso">Curso matriculado: </label>
                    <select name="curso" id="curso">
                        <option value="" disabled selected>Selecciona un curso</option>
                        <option value="1">1° de Grado / Cliclo</option>
                        <option value="2">2° de Grado / Ciclo</option>
                        <option value="3">3° de Grado</option>
                        <option value="4">4° de Grado</option>
                    </select>
                     <br>
                <label for="condiciones_si">Acepto los términos y condiciones </label>  
                    <input type="checkbox" id="condiciones_si" name="codiciones_si" value="si">
                    <br>
                <label for="condiciones_no">No acepto los términos y condiciones </label>
                    <input type="checkbox" id="condiciones_no" name="codiciones_no" value="no">
                    <br>
                <button type="submit">Enviar formulario</button>     
        </fieldset>
    </form>
</body>
</html>
